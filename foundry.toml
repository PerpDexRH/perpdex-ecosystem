[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood = { 
    key = "empty",
    url = "https://robinhoodchain.blockscout.com/api/"
}

robinhood_testnet = {
    key = "empty",
    url = "https://explorer.testnet.chain.robinhood.com/api/"
}
